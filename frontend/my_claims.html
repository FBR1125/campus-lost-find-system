<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的认领记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .header {
            background: #409eff;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 20px;
            font-weight: normal;
        }
        .back-btn {
            background: white;
            color: #409eff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .claim-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .claim-item p {
            margin-bottom: 6px;
            color: #333;
            font-size: 15px;
        }
        /* 撤销按钮样式 */
        .cancel-btn {
            margin-top: 12px;
            background: #f56c6c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .no-data {
            text-align: center;
            color: #999;
            padding: 60px 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

<div class="header">
    <h1>我的认领记录</h1>
    <button class="back-btn" onclick="goBack()">返回个人中心</button>
</div>

<div class="container" id="claimList">
    加载中...
</div>

<script>
    window.onload = async function () {
        let userId = localStorage.getItem("userId");
        if (!userId) {
            alert("请先登录！");
            location.href = "user_login.html";
            return;
        }
        loadMyClaims(userId);
    }

    // 加载我的认领
    async function loadMyClaims(userId) {
        try {
            let res = await fetch("http://localhost:8080/user/my/claims?userId=" + userId);
            let result = await res.json();
            let box = document.getElementById("claimList");

            if (!result.data || result.data.length === 0) {
                box.innerHTML = `<div class="no-data">暂无认领记录</div>`;
                return;
            }

            box.innerHTML = "";
            for (let claim of result.data) {
                let itemId = claim.itemId;
                let itemRes = await fetch("http://localhost:8080/item/" + itemId);
                let itemResult = await itemRes.json();
                let item = itemResult.data;

                // 撤销认领按钮
                box.innerHTML += `
                <div class="claim-item">
                    <p>物品：${item.name}</p>
                    <p>地点：${item.place || '未知'}</p>
                    <p>认领说明：${claim.message || '无'}</p>
                    <button class="cancel-btn" onclick="cancelClaim(${claim.id})">撤销认领</button>
                </div>
                `;
            }
        } catch (e) {
            document.getElementById("claimList").innerHTML = `<div class="no-data">暂无认领记录</div>`;
        }
    }

    // 撤销认领函数
    async function cancelClaim(claimId) {
        if (!confirm("确定要撤销认领吗？")) return;

        let res = await fetch("http://localhost:8080/claim/cancel/" + claimId, {
            method: "DELETE"
        });
        let result = await res.json();
        alert(result.message);

        // 刷新列表
        let userId = localStorage.getItem("userId");
        loadMyClaims(userId);
    }

    function goBack() {
        location.href = "user_center.html";
    }
</script>

</body>
</html>
