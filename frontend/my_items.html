<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的失物记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .header {
            background: #409eff;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tag {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .lost { background: #ffeef0; color: #f56c6c; }
        .found { background: #e8f3ff; color: #409eff; }
        .check {
            margin-top:8px;
            font-size:13px;
            color:#777;
        }
    </style>
</head>

<body>
<div class="header">
    <h1>我的失物记录</h1>
    <button onclick="location.href='user_center.html'" style="background:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">返回个人中心</button>
</div>

<div class="container" id="list-box">
    加载中...
</div>

<script>
    window.onload = async function(){
        let userId = localStorage.getItem("userId");
        if(!userId){
            alert("请先登录");
            location.href="user_login.html";
            return;
        }

        let res = await fetch("http://localhost:8080/user/my/items?userId="+userId);
        let result = await res.json();
        let box = document.getElementById("list-box");

        if(result.data.length === 0){
            box.innerHTML = "<div style='text-align:center; padding:40px; color:#999'>暂无记录</div>";
            return;
        }

        box.innerHTML = "";
        result.data.forEach(item => {
            let typeName = item.type === 0 ? "失物" : "招领";
            let typeClass = item.type === 0 ? "lost" : "found";
            let checkInfo = item.check_status === 0 ? "待审核" : "已通过";

            box.innerHTML += `
            <div class="item">
                <h3>${item.name}</h3>
                <p>地点：${item.place || '未填写'}</p>
                <p>描述：${item.description || '无'}</p>
                <span class="tag ${typeClass}">${typeName}</span>
                <div class="check">审核状态：${checkInfo}</div>
            </div>
            `;
        });
    }
</script>
</body>
</html>
