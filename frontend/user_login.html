<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>普通用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #409eff;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #337ecc;
        }
        #msg {
            text-align: center;
            margin-top: 15px;
            color: red;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>校园失物招领 - 用户登录</h2>
    <input type="text" id="username" placeholder="用户名">
    <input type="password" id="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <div id="msg"></div>
</div>

<script>
    async function login() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let msg = document.getElementById("msg");

        // 普通用户登录接口（和管理员完全分开）
        let res = await fetch("http://localhost:8080/user/login?username="+username+"&password="+password, {
            method: "GET"
        });

        let result = await res.json();

        if (result.code === 200) {
            //判断角色是不是普通用户
            let user = result.data;
            if (user.role !== "user") {
                msg.innerText = "无普通用户权限，请使用用户账号登录";
                msg.style.color = "red";
                return;
            }

            // 登录成功
            msg.innerText = "登录成功！";
            msg.style.color = "green";
            location.href = "user_center.html";
        } else {
            msg.innerText = result.message;
            msg.style.color = "red";
        }
    }
</script>
</body>
</html>
