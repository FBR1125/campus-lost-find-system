<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>普通用户登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #409eff;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .switch-btn {
            background: transparent;
            color: #409eff;
            border: 1px solid #409eff;
            margin-top: 10px;
        }
        #msg {
            text-align: center;
            margin-top: 15px;
            color: red;
        }
        .back-home {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 16px;
            color: #409eff;
            text-decoration: none;
        }
        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>用户登录</h2>
    <a href="index.html" class="back-home">返回主页 -></a>
    <input type="number" id="id" placeholder="请输入账号<id>">
    <input type="password" id="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <button class="switch-btn" onclick="toAdmin()">切换管理员登录</button>
    <div id="msg"></div>
</div>

<script>
    async function login() {
        let id = document.getElementById("id").value;
        let password = document.getElementById("password").value;
        let msg = document.getElementById("msg");

        if(!id || !password){
            msg.innerText = "账号密码不能为空";
            return;
        }

        let res = await fetch("http://localhost:8080/user/login?id="+id+"&password="+password);
        let result = await res.json();

        if (result.code === 200) {
            let user = result.data;
            if (user.role !== "user") {
                msg.innerText = "请使用普通用户账号";
                return;
            }
            localStorage.setItem("isLogin", "true");
            localStorage.setItem("role", user.role);
            localStorage.setItem("username", user.username);
            localStorage.setItem("userId", user.id);
            location.href = "index.html";
        } else {
            msg.innerText = result.message;
        }
    }

    function toAdmin(){
        location.href = "admin_login.html";
    }
</script>
</body>
</html>
