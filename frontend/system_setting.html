<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .header {
            background: #409eff;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-title {
            font-size: 22px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
        }
        .avatar-area {
            margin-bottom: 25px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #409eff;
            color: white;
            font-size: 30px;
            line-height: 80px;
            margin: 0 auto 10px;
            background-size: cover;
            background-position: center;
        }
        .nickname {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }
        .setting-item:first-of-type {
            border-top: none;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #409eff;
            color: white;
            font-size: 14px;
        }
        .btn.danger {
            background: #f56c6c;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .back-btn {
            margin-top: 20px;
            background: #67c23a;
        }
        .admin-tip {
            color: #999;
            font-size: 14px;
        }

        /* 弹出模态框 */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 10px;
        }
        .modal-title {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-item {
            margin-bottom: 15px;
        }
        .form-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-item input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-item input:disabled {
            background: #f5f5f5;
        }
        .modal-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .close-btn {
            background: #999;
        }

        /* 头像预览 */
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #eee;
            margin: 0 auto 15px;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>校园失物招领系统</h1>
    <span id="welcome"></span>
</div>

<div class="container">
    <div class="page-title">系统设置</div>
    <div class="card">
        <div class="avatar-area">
            <div class="avatar" id="avatarChar"></div>
            <div class="nickname" id="nickname"></div>
        </div>

        <div class="setting-item">
            <span>头像</span>
            <button class="btn" onclick="openAvatarModal()">修改</button>
        </div>
        <div class="setting-item">
            <span>个人信息</span>
            <button class="btn" onclick="openEditModal()">修改</button>
        </div>
        <div class="setting-item" id="deleteItem"></div>
    </div>

    <button class="btn back-btn" onclick="goBack()">返回</button>
</div>

<!-- 修改个人信息 弹窗 -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-title">修改个人信息</div>
        <div class="form-item">
            <label>用户ID（不可修改）</label>
            <input id="edit_id" disabled>
        </div>
        <div class="form-item">
            <label>用户名</label>
            <input id="edit_username">
        </div>
        <div class="form-item">
            <label>手机号</label>
            <input id="edit_phone">
        </div>
        <div class="modal-btns">
            <button class="btn close-btn" onclick="closeModal()">取消</button>
            <button class="btn" onclick="saveUserInfo()">保存</button>
        </div>
    </div>
</div>

<!-- 注销账户 弹窗 -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <div class="modal-title">注销账户</div>
        <div style="color:#f56c6c; font-size:12px; margin-bottom:15px;">
            ⚠️ 注销后账户将永久删除，无法恢复！
        </div>
        <div class="form-item">
            <label>请输入登录密码确认注销</label>
            <input id="delete_pwd" type="password" placeholder="请输入密码">
        </div>
        <div class="modal-btns">
            <button class="btn close-btn" onclick="closeDeleteModal()">取消</button>
            <button class="btn danger" onclick="confirmDelete()">确认注销</button>
        </div>
    </div>
</div>

<!-- 修改头像 弹窗 -->
<div class="modal" id="avatarModal">
    <div class="modal-content">
        <div class="modal-title">修改头像</div>
        <div class="avatar-preview" id="avatarPreview"></div>
        <div class="form-item">
            <input type="file" id="avatarFile" accept="image/*">
        </div>
        <div class="modal-btns">
            <button class="btn close-btn" onclick="closeAvatarModal()">取消</button>
            <button class="btn" onclick="saveAvatar()">保存头像</button>
        </div>
    </div>
</div>

<script>
    let originalUsername = "";

    window.onload = function () {
        let userId = localStorage.getItem("userId");
        let username = localStorage.getItem("username");
        let phone = localStorage.getItem("phone");
        let role = localStorage.getItem("role");
        originalUsername = username;

        document.getElementById("welcome").innerText = "欢迎你，" + username;
        document.getElementById("nickname").innerText = username;

        // 加载头像
        loadAvatar();

        let deleteItem = document.getElementById("deleteItem");
        if (role === "admin") {
            deleteItem.innerHTML = `
                <span class="admin-tip">管理员账户不支持注销</span>
                <button class="btn" disabled>注销账户</button>
            `;
        } else {
            deleteItem.innerHTML = `
                <span>注销账户</span>
                <button class="btn danger" onclick="openDeleteModal()">注销账户</button>
            `;
        }
    };

    // 头像功能
    function openAvatarModal() {
        document.getElementById("avatarPreview").style.backgroundImage = document.getElementById("avatarChar").style.backgroundImage;
        document.getElementById("avatarModal").style.display = "flex";
    }

    function closeAvatarModal() {
        document.getElementById("avatarModal").style.display = "none";
    }

    // 选择图片预览
    document.getElementById("avatarFile").addEventListener("change", function (e) {
        let file = e.target.files[0];
        if (!file) return;
        let url = URL.createObjectURL(file);
        document.getElementById("avatarPreview").style.backgroundImage = `url(${url})`;
    });

    // 保存头像
    function saveAvatar() {
        let file = document.getElementById("avatarFile").files[0];
        if (!file) {
            alert("请选择图片！");
            return;
        }
        let reader = new FileReader();
        reader.onload = function (e) {
            let base64 = e.target.result;
            localStorage.setItem("avatar", base64);
            document.getElementById("avatarChar").style.backgroundImage = `url(${base64})`;
            alert("头像修改成功！");
            closeAvatarModal();
        };
        reader.readAsDataURL(file);
    }

    // 页面加载时显示头像
    function loadAvatar() {
        let avatar = localStorage.getItem("avatar");
        let username = localStorage.getItem("username");
        if (avatar) {
            document.getElementById("avatarChar").style.backgroundImage = `url(${avatar})`;
            document.getElementById("avatarChar").innerText = "";
        } else {
            document.getElementById("avatarChar").innerText = username.charAt(0).toUpperCase();
        }
    }

    // 修改个人信息
    function openEditModal() {
        document.getElementById("edit_id").value = localStorage.getItem("userId");
        document.getElementById("edit_username").value = localStorage.getItem("username");
        document.getElementById("edit_phone").value = localStorage.getItem("phone") || "";
        document.getElementById("editModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("editModal").style.display = "none";
    }

    async function saveUserInfo() {
        let id = document.getElementById("edit_id").value;
        let username = document.getElementById("edit_username").value.trim();
        let phone = document.getElementById("edit_phone").value.trim();

        if (!username) {
            alert("用户名不能为空");
            return;
        }
        if (username === originalUsername) {
            alert("新用户名不能和原来一样！");
            return;
        }

        let res = await fetch("http://localhost:8080/user/updateInfo", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: parseInt(id), username: username, phone: phone })
        });
        let result = await res.json();
        if (result.code === 200) {
            alert("修改成功！");
            localStorage.setItem("username", username);
            localStorage.setItem("phone", phone);
            location.reload();
        } else {
            alert("修改失败：" + result.data);
        }
    }

    // 注销账户
    function openDeleteModal() {
        document.getElementById("delete_pwd").value = "";
        document.getElementById("deleteModal").style.display = "flex";
    }

    function closeDeleteModal() {
        document.getElementById("deleteModal").style.display = "none";
    }

    async function confirmDelete() {
        let pwd = document.getElementById("delete_pwd").value.trim();
        let userId = localStorage.getItem("userId");

        if (!pwd) {
            alert("请输入密码！");
            return;
        }

        let res = await fetch("http://localhost:8080/user/deleteAccount", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: parseInt(userId), password: pwd })
        });
        let result = await res.json();
        if (result.code === 200) {
            alert("账号已成功注销！");
            localStorage.clear();
            location.href = "user_login.html";
        } else {
            alert("注销失败：" + result.data);
        }
    }

    function goBack() {
        let role = localStorage.getItem("role");
        location.href = role === "admin" ? "admin.html" : "user_center.html";
    }
</script>
</body>
</html>
